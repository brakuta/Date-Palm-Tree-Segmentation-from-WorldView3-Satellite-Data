name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps only; the MM stack and torch are not needed for the
          # tests, which cover extraction, vectorisation, configs, and
          # diagnostics (no GPU, no model weights).
          pip install rasterio geopandas shapely scikit-image scipy numpy \
                      opencv-python-headless safetensors huggingface_hub \
                      mmengine pytest ruff
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
