name: palmseg
channels: [conda-forge, pytorch, nvidia]
dependencies:
  - python=3.10
  - gdal=3.6
  - rasterio>=1.3
  - geopandas>=0.13
  - shapely>=2.0
  - scikit-image>=0.21
  - scipy>=1.10
  - numpy>=1.24
  - pillow>=9.5
  - tqdm>=4.65
  - pip
  - pip:
      - torch>=2.0
      - mmengine>=0.10.0
      - "mmcv>=2.1.0,<2.2.0"
      - mmsegmentation>=1.2.0
      - opencv-python-headless>=4.7
      - huggingface_hub>=0.20
      - safetensors>=0.4          # load released .safetensors weights
      # - mmdet>=3.0.0            # only for the Mask2Former models
